// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.9.1'
        classpath 'com.google.gms:google-services:4.4.2'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Force Java 17 for all sub-projects (including capacitor-android and
// capacitor-camera/Kotlin modules which otherwise target Java 21 and
// fail on runners with JDK 17).
subprojects {
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android {
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
                if (project.android.hasProperty('kotlinOptions')) {
                    project.android.kotlinOptions {
                        jvmTarget = '17'
                    }
                }
            }
        }
        tasks.withType(JavaCompile).configureEach {
            sourceCompatibility = '17'
            targetCompatibility = '17'
        }
        // Kotlin compile tasks are configured by their own AGP plugin via
        // android.kotlinOptions above. Avoid referencing
        // org.jetbrains.kotlin.gradle.tasks.KotlinCompile by FQN here:
        // the Kotlin Gradle plugin is not in the root buildscript classpath,
        // so the class symbol is unresolvable and Gradle fails configuring
        // the project with "Could not get unknown property 'org'".
        // Fall back to matching by task class simple name at execution time.
        tasks.matching { it.class.name.contains('KotlinCompile') }.configureEach { task ->
            if (task.hasProperty('kotlinOptions')) {
                task.kotlinOptions.jvmTarget = '17'
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
